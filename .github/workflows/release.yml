name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            ext: tar.gz
            pyinstaller_args: ""
          - os: windows-latest
            platform: Windows
            ext: zip
            pyinstaller_args: "--console"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 \
            fonts-noto-cjk-extra fonts-droid-fallback

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pytest
          pip install -r reliatrack/requirements.txt

      - name: Run tests before build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd reliatrack
          python -m pytest tests/ -q --tb=short --ignore=tests/test_boundary.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          cd reliatrack
          pyinstaller --noconfirm --onedir \
            --name ReliaTrack \
            --windowed \
            --hidden-import apsw \
            --hidden-import openpyxl \
            --hidden-import docx \
            --hidden-import reportlab \
            --hidden-import reportlab.lib \
            --hidden-import reportlab.pdfgen \
            --hidden-import reportlab.platypus \
            --hidden-import lxml \
            --collect-all apsw \
            --noupx \
            main.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          cd reliatrack
          pyinstaller --noconfirm --onedir `
            --name ReliaTrack `
            --windowed `
            --hidden-import apsw `
            --hidden-import openpyxl `
            --hidden-import docx `
            --hidden-import reportlab `
            --hidden-import reportlab.lib `
            --hidden-import reportlab.pdfgen `
            --hidden-import reportlab.platypus `
            --hidden-import lxml `
            --collect-all apsw `
            --noupx `
            main.py

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd reliatrack/dist
          tar czf ReliaTrack-${{ matrix.platform }}-x86_64.tar.gz ReliaTrack/

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd reliatrack/dist
          Compress-Archive -Path ReliaTrack -DestinationPath ReliaTrack-${{ matrix.platform }}-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReliaTrack-${{ matrix.platform }}
          path: reliatrack/dist/ReliaTrack-${{ matrix.platform }}-x86_64.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == 'true'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
