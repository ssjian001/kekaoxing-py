name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 \
            fonts-noto-cjk-extra fonts-droid-fallback \
            libxml2-dev libxslt1-dev

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip pytest
          pip install -r reliatrack/requirements.txt

      - name: Compile check
        run: |
          . .venv/bin/activate
          cd reliatrack
          python -m py_compile main.py
          find src -name "*.py" -exec python -m py_compile {} +;
          echo "All files compile successfully"

      - name: Run pytest
        run: |
          . .venv/bin/activate
          cd reliatrack
          QT_QPA_PLATFORM=offscreen python -m pytest tests/ -v --tb=short

      - name: Run E2E tests (script mode)
        run: |
          . .venv/bin/activate
          cd reliatrack
          QT_QPA_PLATFORM=offscreen python tests/test_e2e_full.py

      - name: Run performance baseline
        run: |
          . .venv/bin/activate
          cd reliatrack
          QT_QPA_PLATFORM=offscreen python tests/test_performance.py
