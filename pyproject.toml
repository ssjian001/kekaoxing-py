[project]
name = "reliatrack"
version = "0.1.1"
description = "可靠性测试全生命周期管理系统（PySide6 + SQLite）"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7.0",
    "apsw>=3.44,<4.0",
    "openpyxl>=3.1,<4.0",
    "reportlab>=4.0,<6.0",
    "python-docx>=1.1,<2.0",
    "segno>=1.6",
]

[tool.pytest.ini_options]
testpaths = ["reliatrack/tests"]
